# trace.<domain> -> Langfuse
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^trace\.;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # Trace ingestion batches can be sizeable.
    client_max_body_size 100m;
    limit_conn conn_per_ip 50;

    location = /favicon.ico {
        alias /usr/share/nginx/html/algomotive-observability/algomotive-favicon-v1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location = /favicon-16x16.png {
        alias /usr/share/nginx/html/algomotive-observability/algomotive-favicon-v1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location = /favicon-32x32.png {
        alias /usr/share/nginx/html/algomotive-observability/algomotive-favicon-v1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html/algomotive-observability/algomotive-favicon-v1.png;
        default_type image/png;
        access_log off;
        add_header Cache-Control "no-store";
    }

    location ^~ /algomotive-observability/ {
        alias /usr/share/nginx/html/algomotive-observability/;
        access_log off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = / {
        return 302 /auth/sso-initiate?provider=keycloak;
    }

    location / {

        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://langfuse_upstream;
    }

    # High-throughput ingestion / public API.
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://langfuse_upstream;
    }
}
